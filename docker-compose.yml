name: roadmaplab

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: roadlab
      POSTGRES_PASSWORD: roadlab
      POSTGRES_DB: roadlab
    ports:
      - "127.0.0.1:${ROADLAB_PG_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadlab -d roadlab"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:${ROADLAB_MONGO_PORT:-57018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
